name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pos_admin
          POSTGRES_PASSWORD: pos_secret
          POSTGRES_DB: universal_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap PostgreSQL roles and test database
        run: bash scripts/bootstrap-db.sh
        env:
          POSTGRES_USER: pos_admin
          POSTGRES_PASSWORD: pos_secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_RUNTIME_USER: pos_runtime
          POSTGRES_RUNTIME_PASSWORD: pos_runtime_secret

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Run Prisma migrations as owner (dev DB)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos?schema=public

      - name: Run Prisma migrations as owner (test DB)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_test?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_test?schema=public

      - name: Run Prisma migrations as owner (E2E DB)
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_e2e?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_e2e?schema=public

      - name: Build packages
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

      - name: Lint all workspaces
        run: npm run lint

      - name: Run tests with coverage as non-superuser pos_runtime
        run: npm run test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pos_runtime:pos_runtime_secret@localhost:5432/universal_pos?schema=public
          TEST_DATABASE_URL: postgresql://pos_runtime:pos_runtime_secret@localhost:5432/universal_pos_test?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos?schema=public
          MIGRATION_TEST_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_test?schema=public
          POSTGRES_USER: pos_admin
          POSTGRES_PASSWORD: pos_secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars-long

      - name: Seed demo dataset
        run: npm run seed:demo -- --yes
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pos_runtime:pos_runtime_secret@localhost:5432/universal_pos?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars-long

      - name: Install Playwright browsers with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Reset and seed E2E database
        run: npm run db:reset:e2e
        env:
          NODE_ENV: test
          MIGRATION_E2E_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_e2e?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars-long

      - name: Run Admin Dashboard E2E tests
        run: |
          AUTH_THROTTLE_LIMIT=5000 RATE_LIMIT_LIMIT=5000 REFRESH_THROTTLE_LIMIT=5000 PORT=4000 node apps/api/dist/main.js &
          for i in {1..30}; do
            if curl -sf http://localhost:4000/api/v1/health > /dev/null 2>&1; then
              echo "API server is ready"
              break
            fi
            echo "Waiting for API server..."
            sleep 1
          done
          npm --workspace=@universal-pos/admin run test:e2e -- --project=chromium
        env:
          CI: true
          NODE_ENV: test
          AUTH_THROTTLE_LIMIT: 5000
          RATE_LIMIT_LIMIT: 5000
          REFRESH_THROTTLE_LIMIT: 5000
          PORT: 4000
          DATABASE_URL: postgresql://pos_runtime:pos_runtime_secret@localhost:5432/universal_pos_e2e?schema=public
          TEST_DATABASE_URL: postgresql://pos_runtime:pos_runtime_secret@localhost:5432/universal_pos_e2e?schema=public
          MIGRATION_DATABASE_URL: postgresql://pos_admin:pos_secret@localhost:5432/universal_pos_e2e?schema=public
          JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-chars-long
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          ADMIN_URL: http://localhost:3000

      - name: Verify development database remained untouched by E2E tests
        run: npx tsx scripts/db-counts.ts "postgresql://pos_admin:pos_secret@localhost:5432/universal_pos?schema=public"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7

  smoke-prod:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Prepare production environment
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            let env = fs.readFileSync('deploy/.env.production.example', 'utf8');
            env = env.replace('replace-with-generated-postgres-password', crypto.randomBytes(24).toString('base64url'))
                     .replace('replace-with-generated-runtime-password', crypto.randomBytes(24).toString('base64url'))
                     .replace('replace-with-generated-jwt-access-secret-min-32-chars', crypto.randomBytes(32).toString('hex'))
                     .replace('replace-with-generated-jwt-refresh-secret-min-32-chars', crypto.randomBytes(32).toString('hex'));
            fs.writeFileSync('deploy/.env.production', env);
          "

      - name: Build production images
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production build

      - name: Verify placeholder secrets refusal in production
        run: |
          cp deploy/.env.production.example deploy/.env.placeholder.test
          if docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.placeholder.test run --rm --no-deps api > /dev/null 2>&1; then
            echo "FAILED: API container should have refused placeholder secrets"
            exit 1
          fi
          echo "placeholder env refused: OK"
          rm -f deploy/.env.placeholder.test
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production down -v

      - name: Start production containers
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d

      - name: Wait for API and Admin health
        run: |
          echo "Waiting for Caddy & API to respond..."
          for i in {1..60}; do
            if curl -k -sf https://localhost/api/v1/health > /dev/null 2>&1; then
              echo "Production API is healthy!"
              break
            fi
            echo "Waiting for API... ($i/60)"
            sleep 2
          done
          curl -k -sf https://localhost/api/v1/health || (docker compose -f deploy/docker-compose.prod.yml logs && exit 1)

      - name: Run production smoke test
        run: |
          API_URL=https://localhost/api/v1 node scripts/smoke-prod.mjs

      - name: Verify database runtime role hardening
        run: |
          echo "=== 1. Active database connections query ==="
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -c "
            SELECT pid, usename, application_name, client_addr FROM pg_stat_activity WHERE datname = 'universal_pos';
          "
          NON_RUNTIME_CONNS=$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -t -A -c "
            SELECT count(*) FROM pg_stat_activity WHERE datname = 'universal_pos' AND (application_name ILIKE '%prisma%' OR usename != 'pos_admin') AND usename != 'pos_runtime';
          ")
          if [ "$NON_RUNTIME_CONNS" -ne 0 ]; then
            echo "FAILED: Non-pos_runtime API connection detected!"
            exit 1
          fi
          echo "All API connections are pos_runtime: OK"

          echo "=== 2. pos_runtime privileges check ==="
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -c "
            SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = 'pos_runtime';
          "
          BAD_ROLE=$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -t -A -c "
            SELECT count(*) FROM pg_roles WHERE rolname = 'pos_runtime' AND (rolsuper = true OR rolbypassrls = true);
          ")
          if [ "$BAD_ROLE" -ne 0 ]; then
            echo "FAILED: pos_runtime has rolsuper=true or rolbypassrls=true!"
            exit 1
          fi
          echo "pos_runtime rolsuper=false and rolbypassrls=false: OK"

          echo "=== 3. Table ownership check ==="
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -c "
            SELECT tablename, tableowner FROM pg_tables WHERE schemaname = 'public' AND tableowner = 'pos_runtime';
          "
          OWNED_TABLES=$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production exec -T postgres psql -U pos_admin -d universal_pos -t -A -c "
            SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner = 'pos_runtime';
          ")
          if [ "$OWNED_TABLES" -ne 0 ]; then
            echo "FAILED: pos_runtime owns tables in public schema!"
            exit 1
          fi
          echo "pos_runtime owns 0 tables in public schema: OK"

      - name: Verify superuser database connection refusal
        run: |
          echo "Testing extra API container with superuser pos_admin DATABASE_URL..."
          POSTGRES_PASS=$(grep '^POSTGRES_PASSWORD=' deploy/.env.production | cut -d= -f2)
          OUTPUT=$(docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production run --rm \
            -e DATABASE_URL="postgresql://pos_admin:${POSTGRES_PASS}@postgres:5432/universal_pos?schema=public" \
            api 2>&1 || true)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "FATAL: Database connection user is a PostgreSQL superuser"; then
            echo "FAILED: API container did not output FATAL superuser error!"
            exit 1
          fi
          echo "Superuser refusal verified: OK"

      - name: Tear down production containers
        if: always()
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production down -v

